name: convertify
description: "Convert documents, images, audio and video files on your phone."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  get: ^4.6.6
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  flutter_dotenv: ^5.1.0
  dio: ^5.7.0
  logger: ^2.4.0
  google_mobile_ads: ^5.2.0
  share_plus: ^10.1.4
  open_filex: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.14.1"
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_4.png"
  adaptive_icon_foreground: "assets/icon/app_icon_5.png"
  adaptive_icon_background: "#FF2663FF"

flutter_native_splash:
  color: "#2663FF"
  image: assets/icon/app_icon_5.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#2663FF"

flutter:
  uses-material-design: true

  assets:
    # NOTE: anything listed here ships inside the APK and can be extracted.
    # Move the CloudConvert key behind your own backend before publishing.
    - .env

  fonts:
    - family: Zain
      fonts:
        - asset: assets/font/arabic/Zain-Regular.ttf
          weight: 400
        - asset: assets/font/arabic/Zain-Bold.ttf
          weight: 700
        - asset: assets/font/arabic/Zain-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/font/english/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/font/english/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/font/english/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/font/english/Inter_18pt-ExtraBold.ttf
          weight: 800
